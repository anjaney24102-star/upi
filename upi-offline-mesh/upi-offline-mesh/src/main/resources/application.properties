spring.application.name=upi-offline-mesh
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:mem:${PAYMENT_DB_NAME:upi-mesh};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
payment.encryption-key=${PAYMENT_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
payment.expiry-seconds=${PAYMENT_EXPIRY_SECONDS:300}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
